  <style>
    html {
      overflow: hidden;
    }

    html body {
      padding: 0;
      margin: 0;
    }

    iframe {
      height: 100vh;
    }
  </style>

  <style>
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 600px;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      overflow: hidden;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .iframe-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e9ecef;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .iframe-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <div class="iframe-loader" id="loader">
      <div class="spinner"></div>
    </div>
  <iframe src="https://jostjoopress.wasmer.app/" allow="microphone https://jostjoopress.wasmer.app/" title="دموی افزونه جستجو پرس" width="100%" style="border:0;" allowfullscreen>
</iframe>
    </div>

  <script>
  const iframe = document.getElementById('myIframe');
  const loader = document.getElementById('loader');

  function hideLoader() {
    if (!loader) return;
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 300);
  }

  // ۱) ثبت listener قبل از اینکه دیر شود
  iframe.addEventListener('load', hideLoader);

  // ۲) اگر iframe همین الان بارگذاری شده بود (کش / بارگذاری سریع)
  if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
    hideLoader();
  }

  // ۳) Fallback: اگر بعد از ۱۵ ثانیه هنوز load نشد، اسپینر را بردار
  setTimeout(hideLoader, 15000);
</script>
</body>
